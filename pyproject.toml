[project]
name = "deribit-prices"
version = "0.1.0"
description = "Collects BTC/ETH index prices from Deribit every minute and serves them over a REST API"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10,<4",
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "celery[redis]>=5.4,<6",
    "fastapi>=0.143,<1",
    "pydantic-settings>=2.4,<3",
    "sqlalchemy[asyncio]>=2.0.30,<2.1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2,<3",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<2",
]

[build-system]
requires = ["setuptools>=70,<81"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs a running PostgreSQL (TEST_DATABASE_URL)",
]
